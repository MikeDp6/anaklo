name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, types, unit tests, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Edge Functions: deno check + deno lint (the pinned deno npm devDependency)
      - run: npm run fn:check
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-build-placeholder
      # postbuild scans the output for server keys (scripts/check-secrets.mjs)
      - run: npm run size

  database-e2e:
    name: pgTAP + Playwright (local Supabase)
    runs-on: ubuntu-latest
    # One value for Vite (the /api proxy middleware) and the edge runtime ([edge_runtime.secrets]
    # resolves env(PROXY_SECRET) from the environment). Test-only, not a real secret; ≥ 16 chars.
    env:
      PROXY_SECRET: ci-local-proxy-secret-not-a-secret
      APP_ENV: local
      # public-booking / manage (contract 1.3 §7): the same local values as .env.example.
      ANAKLO_ENV: local
      SITE_HOST: localhost:5173
      SMS_PROVIDER: fake
      OTP_TEST_NUMBERS: '+306900000001,+306900000002,+306900000999'
      OTP_TEST_CODE: '424242'
      SMS_ALLOWED_RECIPIENTS: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # edge-runtime and mailpit stay ON: /api/functions/v1/* needs the functions, and the pro
      # sign-in e2e reads the email code from Mailpit.
      - name: Start Supabase (migrations + seed, Edge Functions, Mailpit)
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: pgTAP
        run: npx supabase test db
      # Concurrent bookings over HTTP (tests/db/**, vitest.db.config.ts). The tests read the API URL
      # and keys from `supabase status -o json` themselves (scripts/lib/cli.mjs, localhost only),
      # so no key goes into $GITHUB_ENV. Before e2e: both sign the seed owner in.
      - name: Booking race tests
        run: npm run test:race
      - name: Generated DB types are up to date
        run: npm run check:types
      - name: Expose local keys to Vite
        run: |
          npx supabase status -o json > supabase-status.json
          node -e "const s=require('./supabase-status.json');console.log('VITE_SUPABASE_URL='+s.API_URL);console.log('VITE_SUPABASE_PUBLISHABLE_KEY='+s.PUBLISHABLE_KEY)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
