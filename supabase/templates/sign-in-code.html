<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anaklo</title>
    <!--
      Supabase Auth "magic link" template: signInWithOtp sends the 6-digit sign-in code with it.
      CODE ONLY, no link and no confirmation URL variable: a link would open Safari, outside the
      installed iOS app (ADR-0009 §1). Static bilingual text (Greek, then English), the documented
      exception to CLAUDE.md rule 8, because Auth sends this email, not our code (ADR-0009 §6).
      "10 minutes" must match otp_expiry = 600. A Send Email Hook replaces it before launch.
    -->
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: #1f1f1f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    "
  >
    <p style="margin: 0 0 8px">Ο κωδικός σύνδεσής σου στο Anaklo:</p>
    <p style="margin: 0 0 16px; font-size: 32px; font-weight: 700; letter-spacing: 6px">
      {{ .Token }}
    </p>
    <p style="margin: 0">
      Γράψε τον στην εφαρμογή. Λήγει σε 10 λεπτά. Αν δεν τον ζήτησες εσύ, αγνόησε αυτό το email.
    </p>
    <hr style="margin: 24px 0; border: 0; border-top: 1px solid #dddddd" />
    <div lang="en">
      <p style="margin: 0 0 8px">Your Anaklo sign-in code:</p>
      <p style="margin: 0 0 16px; font-size: 32px; font-weight: 700; letter-spacing: 6px">
        {{ .Token }}
      </p>
      <p style="margin: 0">
        Enter it in the app. It expires in 10 minutes. If you did not request it, ignore this email.
      </p>
    </div>
  </body>
</html>
